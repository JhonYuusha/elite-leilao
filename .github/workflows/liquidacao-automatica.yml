name: Liquidação automática dos leilões

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidacao-automatica
  cancel-in-progress: false

jobs:
  liquidar:
    name: Processar leilões encerrados
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.SETTLEMENT_DATABASE_URL }}
      NODE_ENV: production
      EXTERNAL_SETTLEMENT: "true"

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validar configuração
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure SETTLEMENT_DATABASE_URL nos secrets do repositório."
            exit 1
          fi

      - name: Instalar dependências de execução e compilação
        run: npm ci --include=dev

      - name: Verificar executável TypeScript
        run: |
          npm exec --no -- tsx --version

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Diagnosticar conexão PostgreSQL
        run: |
          node --input-type=module <<'EOF'
          import pg from "pg";

          const url = new URL(process.env.DATABASE_URL);

          console.log("Protocolo:", url.protocol);
          console.log("Porta:", url.port || "5432");
          console.log("Banco configurado:", Boolean(url.pathname.slice(1)));
          console.log("Usuário configurado:", Boolean(url.username));
          console.log("SSL mode:", url.searchParams.get("sslmode") ?? "não especificado");

          const client = new pg.Client({
            connectionString: process.env.DATABASE_URL,
             ssl: {
            rejectUnauthorized: false,
                },
            connectionTimeoutMillis: 10000,
                });

          try {
            await client.connect();
            const result = await client.query(
              "SELECT current_database() AS database_name, current_user AS user_name"
            );
            console.log("Conexão estabelecida:", result.rows[0]);
          } catch (error) {
            console.error("Código PostgreSQL:", error.code ?? "indisponível");
            console.error("Mensagem:", error.message);
            process.exitCode = 1;
          } finally {
            await client.end().catch(() => {});
          }
          EOF

      - name: Processar lotes vencidos
        run: npm run settle:expired